<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>迹光 · Logo 方案</title>
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml" />
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; background: #F2FBFC; color: #0F172A; padding: 48px 6vw; }
    h1 { margin: 0 0 6px; font-size: 26px; }
    .sub { color: #64748B; margin: 0 0 36px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 24px; }
    .opt { background: #fff; border-radius: 24px; padding: 28px; box-shadow: 0 16px 40px -16px rgba(14,116,144,.25); }
    .opt h2 { margin: 0 0 4px; font-size: 18px; }
    .opt p { margin: 0 0 20px; color: #64748B; font-size: 13px; line-height: 1.6; }
    .tag { display: inline-block; padding: 2px 10px; border-radius: 999px; background: #CCFBF1; color: #0F766E; font-size: 12px; font-weight: 600; margin-left: 8px; vertical-align: middle; }
    .big { display: flex; justify-content: center; padding: 18px 0 24px; }
    .big svg, .big img { width: 128px; height: 128px; }
    .sizes { display: flex; align-items: flex-end; gap: 18px; padding: 16px 0; border-top: 1px dashed #E2E8F0; }
    .sizes svg, .sizes img { display: block; }
    .lockup { display: flex; align-items: center; gap: 10px; padding: 16px; border-radius: 16px; background: #F4F7FA; margin-top: 8px; }
    .lockup b { font-size: 22px; letter-spacing: .06em; }
    .lockup span { font-size: 13px; color: #64748B; padding-left: 10px; border-left: 1px solid #CBD5E1; }
    .lockup.dark { background: #0F172A; color: #fff; }
    .lockup.dark span { color: #94A3B8; border-color: #334155; }
  </style>
</head>
<body>
  <h1>迹光 · Logo 方案</h1>
  <p class="sub">名称取意"足迹 + 点亮"。你选定的方案 C 已替换登录页图标，A、B 保留作对照。</p>

  <div class="grid">

    <!-- A：定位针 + 光芒（备选） -->
    <section class="opt">
      <h2>A · 光点 <span class="tag">备选</span></h2>
      <p>定位针代表去过的地方，右上角的光芒代表"点亮"。形状最直观，小尺寸也清晰。</p>
      <div class="big"><img src="assets/logo-a.svg" alt="方案 A" /></div>
      <div class="sizes"><img src="assets/logo-a.svg" width="64" height="64" alt="" /><img src="assets/logo-a.svg" width="40" height="40" alt="" /><img src="assets/logo-a.svg" width="24" height="24" alt="" /><img src="assets/logo-a.svg" width="16" height="16" alt="" /></div>
      <div class="lockup"><img src="assets/logo-a.svg" width="36" height="36" alt="" /><b>迹光</b><span>旅行素材网盘</span></div>
      <div class="lockup dark"><img src="assets/logo-a.svg" width="36" height="36" alt="" /><b>迹光</b><span>旅行素材网盘</span></div>
    </section>

    <!-- B：云 + 定位点 -->
    <section class="opt">
      <h2>B · 云迹</h2>
      <p>云朵代表网盘，里面的定位点代表素材的位置。网盘属性更强，和"地图"的联系稍弱。</p>
      <div class="big">
        <svg viewBox="0 0 64 64" width="128" height="128"><defs><linearGradient id="gb" x1="6" y1="2" x2="58" y2="62" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#2DD4BF"/><stop offset=".5" stop-color="#0D9488"/><stop offset="1" stop-color="#0E7490"/></linearGradient></defs>
          <rect width="64" height="64" rx="18" fill="url(#gb)"/>
          <path fill="#fff" d="M19 46a9.5 9.5 0 0 1-1.4-18.9A14 14 0 0 1 44.6 25 10.5 10.5 0 0 1 46 46z"/>
          <path fill="#0D9488" fill-rule="evenodd" d="M32 28a6.2 6.2 0 0 0-6.2 6.2c0 4.4 6.2 9.8 6.2 9.8s6.2-5.4 6.2-9.8A6.2 6.2 0 0 0 32 28zm0 8.6a2.4 2.4 0 1 1 0-4.8 2.4 2.4 0 0 1 0 4.8z"/>
        </svg>
      </div>
      <div class="sizes">
        <svg viewBox="0 0 64 64" width="64" height="64"><rect width="64" height="64" rx="18" fill="url(#gb)"/><path fill="#fff" d="M19 46a9.5 9.5 0 0 1-1.4-18.9A14 14 0 0 1 44.6 25 10.5 10.5 0 0 1 46 46z"/><path fill="#0D9488" fill-rule="evenodd" d="M32 28a6.2 6.2 0 0 0-6.2 6.2c0 4.4 6.2 9.8 6.2 9.8s6.2-5.4 6.2-9.8A6.2 6.2 0 0 0 32 28zm0 8.6a2.4 2.4 0 1 1 0-4.8 2.4 2.4 0 0 1 0 4.8z"/></svg>
        <svg viewBox="0 0 64 64" width="40" height="40"><rect width="64" height="64" rx="18" fill="url(#gb)"/><path fill="#fff" d="M19 46a9.5 9.5 0 0 1-1.4-18.9A14 14 0 0 1 44.6 25 10.5 10.5 0 0 1 46 46z"/><path fill="#0D9488" fill-rule="evenodd" d="M32 28a6.2 6.2 0 0 0-6.2 6.2c0 4.4 6.2 9.8 6.2 9.8s6.2-5.4 6.2-9.8A6.2 6.2 0 0 0 32 28zm0 8.6a2.4 2.4 0 1 1 0-4.8 2.4 2.4 0 0 1 0 4.8z"/></svg>
        <svg viewBox="0 0 64 64" width="24" height="24"><rect width="64" height="64" rx="18" fill="url(#gb)"/><path fill="#fff" d="M19 46a9.5 9.5 0 0 1-1.4-18.9A14 14 0 0 1 44.6 25 10.5 10.5 0 0 1 46 46z"/><path fill="#0D9488" fill-rule="evenodd" d="M32 28a6.2 6.2 0 0 0-6.2 6.2c0 4.4 6.2 9.8 6.2 9.8s6.2-5.4 6.2-9.8A6.2 6.2 0 0 0 32 28zm0 8.6a2.4 2.4 0 1 1 0-4.8 2.4 2.4 0 0 1 0 4.8z"/></svg>
        <svg viewBox="0 0 64 64" width="16" height="16"><rect width="64" height="64" rx="18" fill="url(#gb)"/><path fill="#fff" d="M19 46a9.5 9.5 0 0 1-1.4-18.9A14 14 0 0 1 44.6 25 10.5 10.5 0 0 1 46 46z"/><path fill="#0D9488" fill-rule="evenodd" d="M32 28a6.2 6.2 0 0 0-6.2 6.2c0 4.4 6.2 9.8 6.2 9.8s6.2-5.4 6.2-9.8A6.2 6.2 0 0 0 32 28zm0 8.6a2.4 2.4 0 1 1 0-4.8 2.4 2.4 0 0 1 0 4.8z"/></svg>
      </div>
      <div class="lockup">
        <svg viewBox="0 0 64 64" width="36" height="36"><rect width="64" height="64" rx="18" fill="url(#gb)"/><path fill="#fff" d="M19 46a9.5 9.5 0 0 1-1.4-18.9A14 14 0 0 1 44.6 25 10.5 10.5 0 0 1 46 46z"/><path fill="#0D9488" fill-rule="evenodd" d="M32 28a6.2 6.2 0 0 0-6.2 6.2c0 4.4 6.2 9.8 6.2 9.8s6.2-5.4 6.2-9.8A6.2 6.2 0 0 0 32 28zm0 8.6a2.4 2.4 0 1 1 0-4.8 2.4 2.4 0 0 1 0 4.8z"/></svg>
        <b>迹光</b><span>旅行素材网盘</span>
      </div>
    </section>

    <!-- C：路径 + 终点（当前使用） -->
    <section class="opt">
      <h2>C · 行迹 <span class="tag">当前使用</span></h2>
      <p>虚线路径从旅程起点一路汇入地图定位点，表示素材归档、路线记录与足迹汇聚。</p>
      <div class="big"><img src="assets/logo.svg" alt="方案 C" /></div>
      <div class="sizes"><img src="assets/logo.svg" width="64" height="64" alt="" /><img src="assets/logo.svg" width="40" height="40" alt="" /><img src="assets/logo.svg" width="24" height="24" alt="" /><img src="assets/logo.svg" width="16" height="16" alt="" /></div>
      <div class="lockup"><img src="assets/logo.svg" width="36" height="36" alt="" /><b>迹光</b><span>旅行素材网盘</span></div>
      <div class="lockup dark"><img src="assets/logo.svg" width="36" height="36" alt="" /><b>迹光</b><span>旅行素材网盘</span></div>
    </section>

  </div>
</body>
</html>
