<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#fff" fill-opacity=".14"/>
    </pattern>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#99F6E4" stop-opacity=".85"/>
      <stop offset="1" stop-color="#99F6E4" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#dots)"/>

  <!-- 已点亮的区域 -->
  <g fill="#5EEAD4" fill-opacity=".16" stroke="#99F6E4" stroke-opacity=".55" stroke-width="1.5" stroke-linejoin="round">
    <path d="M610 150 L700 120 L790 150 L830 220 L780 290 L690 300 L620 250 Z"/>
    <path d="M780 290 L870 270 L950 330 L930 410 L850 440 L790 380 Z"/>
    <path d="M520 330 L610 320 L650 400 L600 470 L520 440 Z"/>
    <path d="M690 300 L780 290 L790 380 L720 420 L650 400 Z"/>
  </g>

  <!-- 尚未点亮的区域 -->
  <g fill="none" stroke="#fff" stroke-opacity=".16" stroke-width="1.2" stroke-linejoin="round">
    <path d="M850 440 L930 410 L1010 470 L990 560 L900 580 L840 520 Z"/>
    <path d="M600 470 L650 400 L720 420 L760 500 L700 570 L620 560 Z"/>
    <path d="M440 200 L520 180 L610 250 L520 330 L450 290 Z"/>
    <path d="M720 420 L790 380 L850 440 L840 520 L760 500 Z"/>
  </g>

  <!-- 路线与足迹点 -->
  <path d="M300 760 C 380 700, 430 640, 520 600 S 650 520, 700 430 S 760 300, 860 250"
        fill="none" stroke="#99F6E4" stroke-width="2.5" stroke-dasharray="2 9" stroke-linecap="round"/>
  <g>
    <circle cx="520" cy="600" r="26" fill="url(#glow)"/><circle cx="520" cy="600" r="6" fill="#fff"/><circle cx="520" cy="600" r="3" fill="#0F766E"/>
    <circle cx="700" cy="430" r="26" fill="url(#glow)"/><circle cx="700" cy="430" r="6" fill="#fff"/><circle cx="700" cy="430" r="3" fill="#0F766E"/>
    <circle cx="860" cy="250" r="26" fill="url(#glow)"/><circle cx="860" cy="250" r="6" fill="#fff"/><circle cx="860" cy="250" r="3" fill="#0F766E"/>
  </g>
</svg>
